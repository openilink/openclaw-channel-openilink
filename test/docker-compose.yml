services:
  mock-llm:
    build:
      context: .
      dockerfile: Dockerfile.mock
    command: node mock-llm.mjs
    environment:
      MOCK_LLM_PORT: "9100"
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9100/health').then(r=>{if(!r.ok)throw r})"]
      interval: 2s
      retries: 5

  mock-hub:
    build:
      context: .
      dockerfile: Dockerfile.mock
    command: node mock-hub.mjs
    environment:
      MOCK_HUB_PORT: "9200"
      MOCK_HUB_MESSAGE: "hello from integration test"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:9200/health').then(r=>{if(!r.ok)throw r})"]
      interval: 2s
      retries: 5

  openclaw:
    image: node:22
    depends_on:
      mock-llm:
        condition: service_healthy
      mock-hub:
        condition: service_healthy
    environment:
      HOME: /root
    volumes:
      - ./openclaw.config.json:/tmp/openclaw.config.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== Installing OpenClaw ==="
        npm install -g openclaw

        echo "=== Installing plugin (no config yet) ==="
        rm -rf /root/.openclaw/extensions/openclaw-channel-openilink
        openclaw plugins install openclaw-channel-openilink

        echo "=== Writing config after plugin is installed ==="
        mkdir -p /root/.openclaw
        cp /tmp/openclaw.config.json /root/.openclaw/openclaw.json

        echo "=== Starting OpenClaw gateway (background, 30s timeout) ==="
        timeout 30 openclaw gateway --verbose 2>&1 &
        OC_PID=$$!

        echo "=== Waiting for reply to arrive at mock-hub ==="
        for i in $$(seq 1 20); do
          sleep 1
          REPLIES=$$(node -e "fetch('http://mock-hub:9200/replies').then(r=>r.json()).then(d=>console.log(JSON.stringify(d)))" 2>/dev/null || echo "[]")
          echo "  poll $$i: $$REPLIES"
          if echo "$$REPLIES" | node -e "const d=JSON.parse(require('fs').readFileSync(0,'utf8'));process.exit(d.length>0?0:1)" 2>/dev/null; then
            echo "=== SUCCESS: received reply at mock-hub ==="
            kill $$OC_PID 2>/dev/null || true
            exit 0
          fi
        done

        echo "=== FAIL: no reply received within timeout ==="
        kill $$OC_PID 2>/dev/null || true
        exit 1
